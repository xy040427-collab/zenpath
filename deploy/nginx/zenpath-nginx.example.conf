# 择境 ZENPATH - Nginx 配置模板
# 复制此文件为 zenpath-nginx.conf 并替换占位符后使用
# cp deploy/nginx/zenpath-nginx.example.conf /etc/nginx/sites-enabled/zenpath.conf

server {
    listen 80;
    server_name YOUR_SERVER_IP_OR_DOMAIN;

    # 前端静态文件
    location /zenpath/ {
        alias /path/to/gaokao-volunteer/frontend/dist/;
        try_files $uri $uri/ /zenpath/index.html;
    }

    # 后端 API
    location /zenpath/api/ {
        proxy_pass http://127.0.0.1:3458/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120;
    }
}
